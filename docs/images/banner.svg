<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fcf9" />
      <stop offset="1" stop-color="#e9f4ee" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14906a" />
      <stop offset="1" stop-color="#0c5c44" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a97a" />
      <stop offset="1" stop-color="#0f8a62" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7fd6a8" stop-opacity="0.35" />
      <stop offset="1" stop-color="#7fd6a8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#12805c" opacity="0.08" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c3b2c" flood-opacity="0.14" />
    </filter>
    <filter id="winShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0c3b2c" flood-opacity="0.18" />
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="240%" height="240%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0c3b2c" flood-opacity="0.28" />
    </filter>
    <clipPath id="win">
      <rect x="700" y="64" width="424" height="272" rx="18" />
    </clipPath>
    <clipPath id="cardClip">
      <rect x="8" y="8" width="1184" height="384" rx="28" />
    </clipPath>
  </defs>

  <!-- floating light card -->
  <g filter="url(#cardShadow)">
    <rect x="8" y="8" width="1184" height="384" rx="28" fill="url(#card)" stroke="#d3e5da" />
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="8" y="8" width="1184" height="384" fill="url(#dots)" />
    <rect x="8" y="8" width="1184" height="384" fill="url(#glow)" />
  </g>

  <!-- ===== brand block ===== -->
  <g transform="translate(92,134)">
    <rect width="96" height="96" rx="26" fill="url(#tile)" />
    <circle cx="48" cy="48" r="25" fill="none" stroke="#ffffff" stroke-width="5.5" />
    <path d="M36 49 L44.5 57.5 L61 39.5" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="22" r="4.5" fill="#8fe3b9" />
  </g>
  <text x="216" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="700" fill="#0e2e24">RollCall</text>
  <text x="219" y="245" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" fill="#4a5d54">通用考勤与出勤时长管理系统</text>
  <text x="220" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" letter-spacing="5.2" fill="#12805c">GENERIC ATTENDANCE &amp; HOURS TRACKING</text>

  <!-- ===== product window mockup ===== -->
  <g filter="url(#winShadow)">
    <rect x="700" y="64" width="424" height="272" rx="18" fill="#ffffff" stroke="#dfeae4" />
  </g>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="700" y="64" width="424" height="42" fill="#f2f7f4" />
    <circle cx="726" cy="85" r="5" fill="#c9d8d0" />
    <circle cx="744" cy="85" r="5" fill="#c9d8d0" />
    <circle cx="762" cy="85" r="5" fill="#c9d8d0" />
    <rect x="806" y="76" width="150" height="18" rx="9" fill="#e2ece6" />
    <!-- sidebar -->
    <rect x="700" y="106" width="96" height="230" fill="#14342a" />
    <rect x="720" y="132" width="56" height="10" rx="5" fill="#7fd6a8" />
    <rect x="720" y="164" width="56" height="10" rx="5" fill="#ffffff" opacity="0.28" />
    <rect x="720" y="196" width="56" height="10" rx="5" fill="#ffffff" opacity="0.28" />
    <rect x="720" y="228" width="56" height="10" rx="5" fill="#ffffff" opacity="0.28" />
    <!-- rows -->
    <circle cx="836" cy="144" r="15" fill="#dcebe3" />
    <rect x="864" y="134" width="112" height="10" rx="5" fill="#cfe3d8" />
    <rect x="864" y="152" width="72" height="8" rx="4" fill="#e6efe9" />
    <rect x="1032" y="136" width="58" height="22" rx="11" fill="#12805c" opacity="0.15" />
    <rect x="1046" y="143" width="30" height="8" rx="4" fill="#12805c" opacity="0.8" />

    <circle cx="836" cy="200" r="15" fill="#dcebe3" />
    <rect x="864" y="190" width="112" height="10" rx="5" fill="#cfe3d8" />
    <rect x="864" y="208" width="72" height="8" rx="4" fill="#e6efe9" />
    <rect x="1032" y="192" width="58" height="22" rx="11" fill="#12805c" opacity="0.15" />
    <rect x="1046" y="199" width="30" height="8" rx="4" fill="#12805c" opacity="0.8" />

    <circle cx="836" cy="256" r="15" fill="#dcebe3" />
    <rect x="864" y="246" width="112" height="10" rx="5" fill="#cfe3d8" />
    <rect x="864" y="264" width="72" height="8" rx="4" fill="#e6efe9" />
    <rect x="1032" y="248" width="58" height="22" rx="11" fill="#c0454c" opacity="0.13" />
    <rect x="1046" y="255" width="30" height="8" rx="4" fill="#c0454c" opacity="0.65" />

    <!-- progress -->
    <rect x="812" y="300" width="288" height="12" rx="6" fill="#e2ede7" />
    <rect x="812" y="300" width="192" height="12" rx="6" fill="url(#accent)" />
  </g>

  <!-- floating verified badge -->
  <g transform="translate(694,302)" filter="url(#badgeShadow)">
    <circle r="36" fill="url(#accent)" />
    <path d="M-14 1 L-4.5 10.5 L15 -9.5" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
